; PlatformIO wrapper around a native ESP-IDF project: `idf.py build` and
; `pio run` build the same firmware from the same CMakeLists and components.
; src_dir points at main/ because PlatformIO expects "src", ESP-IDF "main".

[platformio]
src_dir = main

; One environment per board. They share everything but the board's own
; sdkconfig defaults (boards/<id>/), which pick its entry in
; components/board/boards.c. The 9" ESP32-P4 board builds with idf.py
; instead (scripts/build-firmware.sh p4): PlatformIO's platform has no P4.
[esp32_board]
; Pinned: the platform, IDF and compiler must match. A newer platform pulls a
; newer xtensa compiler that IDF 5.4's version check rejects.
platform = espressif32 @ 6.10.0
board = esp32dev
framework = espidf
platform_packages =
    framework-espidf @ 3.50400.0
    toolchain-xtensa-esp-elf @ 14.2.0+20241119

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

; Writes verify at 460800. Reading flash back (esptool read_flash) through the
; CH340 drops bytes above 115200, so back up at the default speed.
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; ESP32 "Cheap Yellow Display" (ESP32-2432S028R) and clones (ELEGOO E32R28T).
[env:cyd]
extends = esp32_board
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/cyd28/sdkconfig.defaults

; 3.5" and 4.0" ST7796 boards with resistive touch: Sunton ESP32-3248S035R,
; ELEGOO / LCDwiki E32R35T and E32R40T.
[env:st7796r]
extends = esp32_board
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/st7796r/sdkconfig.defaults

; 3.5" Sunton ESP32-3248S035C, GT911 capacitive touch.
[env:sunton35c]
extends = esp32_board
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/sunton35c/sdkconfig.defaults
