; PlatformIO wrapper around a native ESP-IDF project: `idf.py build` and
; `pio run` build the same firmware from the same CMakeLists and components.
; src_dir points at main/ because PlatformIO expects "src", ESP-IDF "main".

[platformio]
src_dir = main

; ESP32 "Cheap Yellow Display" (ESP32-2432S028R) and clones.
[env:cyd]
; Pinned: the platform, IDF and compiler must match. A newer platform pulls a
; newer xtensa compiler that IDF 5.4's version check rejects.
platform = espressif32 @ 6.10.0
board = esp32dev
framework = espidf
platform_packages =
    framework-espidf @ 3.50400.0
    toolchain-xtensa-esp-elf @ 14.2.0+20241119

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

; Writes verify at 460800. Reading flash back (esptool read_flash) through the
; CH340 drops bytes above 115200, so back up at the default speed.
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
