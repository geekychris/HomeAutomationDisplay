name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r hub/requirements-dev.txt
      - run: cd hub && python -m pytest -q tests

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image (amd64)
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22 hub

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'components/*/idf_component.yml') }}
      - run: pip install platformio esptool
      - run: PIO=pio scripts/build-firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin
